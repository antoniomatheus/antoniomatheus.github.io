<!-- The layout is divided into two sections
  the layout covers the whole screen
  one part has a background image which takes about 30% of the screen
  the other part has the sign up form
    - a header banner introducing the 'product'
    - the sign up form itself, it has some form validation
    - a button to submit the form
    - an alternative button if the person already has an account
  -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <div class="background-img">
        <img src="../assets/black-background.jpg" alt="Simple background" />
        <div class="logo-banner">
          <img src="../assets/odin-logo.png" alt="Odin logo" />
          <span>ODIN</span>
        </div>
        <span class="img-copyright"
          >Photo by <a href="https://unsplash.com/@kirp">Andrew Kliatskyi</a> on
          <a href="https://unsplash.com/photos/background-pattern-ORWTggEn8rM"
            >Unsplash</a
          ></span
        >
      </div>
      <div class="signup"></div>
    </main>
  </body>
</html>
